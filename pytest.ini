[pytest]
testpaths = tests
addopts = -ra -p no:cacheprovider
markers =
    live: hits live network APIs (MCP data sources); needs --runlive
    llm: calls the live LLM endpoint; needs --runllm (and PNNL_API_KEY)
    compute: builds/runs ELM on SLURM; needs --runcompute (and an salloc node)
    localdata: reads a finished run and observations on local disk; needs --runlocaldata
    review_gate: the user's review of the field notes, method contracts and mechanisms, failing while one is a draft; needs --review-gate
