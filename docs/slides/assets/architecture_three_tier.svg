<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#334155"/>
    </marker>
    <marker id="arrm" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#c2410c"/>
    </marker>
    <marker id="arrb" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#2c7fb8"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="270" y="20" width="420" height="46" rx="10" fill="#0f172a"/>
  <text x="480" y="49" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Natural-language scientific question</text>
  <path d="M480,66 L480,96" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- TIER 1 -->
  <rect x="40" y="100" width="700" height="150" rx="14" fill="#e6f3f7" stroke="#2c7fb8" stroke-width="2"/>
  <text x="60" y="128" fill="#1d5e85" font-size="15" font-weight="800">TIER 1 · LLM reasoning — judgement only, never a coordinate</text>
  <rect x="62" y="142" width="300" height="86" rx="10" fill="#fff" stroke="#41b6c4" stroke-width="1.6"/>
  <text x="212" y="166" fill="#0f3d57" font-size="15" font-weight="700" text-anchor="middle">Reception agent</text>
  <text x="212" y="187" fill="#475569" font-size="11.5" text-anchor="middle">frames the question · picks the model by</text>
  <text x="212" y="203" fill="#475569" font-size="11.5" text-anchor="middle">READING the servers · gathers the evidence</text>
  <text x="212" y="219" fill="#475569" font-size="11.5" text-anchor="middle">site · conceptual sweep · coupling</text>
  <rect x="418" y="142" width="300" height="86" rx="10" fill="#fff" stroke="#41b6c4" stroke-width="1.6"/>
  <text x="568" y="166" fill="#0f3d57" font-size="15" font-weight="700" text-anchor="middle">Planner agent</text>
  <text x="568" y="187" fill="#475569" font-size="11.5" text-anchor="middle">designs the strategy under the LIMITS</text>
  <text x="568" y="203" fill="#475569" font-size="11.5" text-anchor="middle">the chosen model reported for itself</text>
  <text x="568" y="219" fill="#475569" font-size="11.5" text-anchor="middle">N · strata · what may be compared</text>
  <path d="M362,185 L418,185" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- MCP tools (right) -->
  <rect x="772" y="100" width="148" height="150" rx="14" fill="#fff7ed" stroke="#fd8d3c" stroke-width="2"/>
  <text x="846" y="126" fill="#c2410c" font-size="13.5" font-weight="800" text-anchor="middle">MCP data tools</text>
  <text x="846" y="147" fill="#7c2d12" font-size="11" text-anchor="middle">terrain · daymet</text>
  <text x="846" y="163" fill="#7c2d12" font-size="11" text-anchor="middle">usgs_water · snotel</text>
  <text x="846" y="179" fill="#7c2d12" font-size="11" text-anchor="middle">ameriflux · hydrodata</text>
  <text x="846" y="205" fill="#9a3412" font-size="10.5" font-style="italic" text-anchor="middle">real geospatial</text>
  <text x="846" y="219" fill="#9a3412" font-size="10.5" font-style="italic" text-anchor="middle">evidence — fetched</text>
  <text x="846" y="233" fill="#9a3412" font-size="10.5" font-style="italic" text-anchor="middle">HERE and nowhere else</text>
  <path d="M740,175 L772,175" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrm)"/>
  <path d="M772,150 L744,150" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrm)"/>

  <!-- T1 -> T2 -->
  <path d="M390,250 L390,300" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="410" y="262" width="330" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="420" y="280" fill="#334155" font-size="12.5" font-weight="600">reception.json + strategy.json — altitude only</text>

  <!-- TIER 2 -->
  <rect x="40" y="304" width="700" height="132" rx="14" fill="#efe7f5" stroke="#8856a7" stroke-width="2"/>
  <text x="60" y="330" fill="#6b3fa0" font-size="15" font-weight="800">TIER 2 · Experiment Manager (Python — no LLM)</text>
  <text x="60" y="348" fill="#6b21a8" font-size="11">one sequence for every model; three ways in</text>
  <g font-size="12" fill="#3b1f57" font-weight="600" text-anchor="middle">
    <rect x="62"  y="358" width="124" height="50" rx="9" fill="#fff" stroke="#9c6fc0"/><text x="124" y="379">check</text><text x="124" y="396" font-size="10.5" font-weight="400" fill="#6b21a8">STOP or correct</text>
    <rect x="202" y="358" width="150" height="50" rx="9" fill="#fff" stroke="#9c6fc0"/><text x="277" y="379">materialize</text><text x="277" y="396" font-size="10.5" font-weight="400" fill="#6b21a8">sample · sweep · couple</text>
    <rect x="368" y="358" width="150" height="50" rx="9" fill="#fff" stroke="#9c6fc0"/><text x="443" y="379">the ONE build call</text><text x="443" y="396" font-size="10.5" font-weight="400" fill="#6b21a8">the model server's</text>
    <rect x="534" y="358" width="188" height="50" rx="9" fill="#fff" stroke="#9c6fc0"/><text x="628" y="379">run · extract · package</text><text x="628" y="396" font-size="10.5" font-weight="400" fill="#6b21a8">experiment.json</text>
  </g>
  <g stroke="#9c6fc0" stroke-width="1.8" marker-end="url(#arr)">
    <path d="M186,383 L202,383"/><path d="M352,383 L368,383"/><path d="M518,383 L534,383"/>
  </g>

  <!-- model servers, right of tier 2 -->
  <rect x="772" y="304" width="148" height="132" rx="14" fill="#e6f3f7" stroke="#2c7fb8" stroke-width="2"/>
  <text x="846" y="330" fill="#1d5e85" font-size="13.5" font-weight="800" text-anchor="middle">MCP model servers</text>
  <text x="846" y="352" fill="#0f3d57" font-size="12" font-weight="700" text-anchor="middle">elm</text>
  <text x="846" y="370" fill="#0f3d57" font-size="12" font-weight="700" text-anchor="middle">pflotran</text>
  <text x="846" y="392" fill="#475569" font-size="10.5" font-style="italic" text-anchor="middle">every model fact</text>
  <text x="846" y="406" fill="#475569" font-size="10.5" font-style="italic" text-anchor="middle">lives behind here —</text>
  <text x="846" y="420" fill="#475569" font-size="10.5" font-style="italic" text-anchor="middle">the framework has none</text>
  <path d="M740,370 L772,370" stroke="#2c7fb8" stroke-width="2.2" marker-end="url(#arrb)"/>

  <!-- anti-hallucination boundary -->
  <line x1="40" y1="452" x2="740" y2="452" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="744" y="456" fill="#dc2626" font-size="10.5" font-weight="700">anti-hallucination boundary</text>

  <!-- T2 -> T3 -->
  <path d="M390,436 L390,490" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="410" y="462" width="340" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="420" y="480" fill="#334155" font-size="12.5" font-weight="600">columns.json — concrete lat/lon, post-build</text>

  <!-- TIER 3 -->
  <rect x="40" y="494" width="700" height="128" rx="14" fill="#e7f4e7" stroke="#31a354" stroke-width="2"/>
  <text x="60" y="520" fill="#217a3e" font-size="15" font-weight="800">TIER 3 · execution — each model in its own way</text>
  <g font-size="12" fill="#143d20" font-weight="600" text-anchor="middle">
    <rect x="62"  y="536" width="200" height="66" rx="9" fill="#fff" stroke="#5cb85c"/>
    <text x="162" y="558">elm</text>
    <text x="162" y="576" font-size="10.5" font-weight="400" fill="#15803d">CIME build / clone, SLURM;</text>
    <text x="162" y="591" font-size="10.5" font-weight="400" fill="#15803d">or in place inside an allocation</text>
    <rect x="282" y="536" width="200" height="66" rx="9" fill="#fff" stroke="#5cb85c"/>
    <text x="382" y="558">pflotran</text>
    <text x="382" y="576" font-size="10.5" font-weight="400" fill="#15803d">one deck per column,</text>
    <text x="382" y="591" font-size="10.5" font-weight="400" fill="#15803d">run inline, seconds each</text>
    <rect x="502" y="536" width="220" height="66" rx="9" fill="#fff" stroke="#5cb85c"/>
    <text x="612" y="558">coupled</text>
    <text x="612" y="576" font-size="10.5" font-weight="400" fill="#15803d">each model started from the</text>
    <text x="612" y="591" font-size="10.5" font-weight="400" fill="#15803d">other's answer, iterated to a stop</text>
  </g>

  <!-- TIER 4 · Analyzer -->
  <path d="M390,622 L390,650" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="40" y="654" width="700" height="76" rx="14" fill="#fdf3e7" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="680" fill="#92400e" font-size="15" font-weight="800">TIER 4 · Analyzer (LLM again — but only over what ran)</text>
  <text x="60" y="700" fill="#78350f" font-size="11.5">compare against the fetched observations · investigate · interpret · audit its own claims</text>
  <text x="60" y="718" fill="#78350f" font-size="11.5">every number comes from experiment.json; a claim it cannot ground is a caveat, not a sentence</text>

  <!-- output -->
  <path d="M390,730 L390,752" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="180" y="756" width="420" height="30" rx="10" fill="#0f172a"/>
  <text x="390" y="777" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">A report with claims, figures and a verdict</text>
</svg>
