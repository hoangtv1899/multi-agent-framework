<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/>
    </marker>
    <marker id="arrd" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#ffffff; stroke:#2e75b6; stroke-width:2.2; rx:12; }
    .inner { fill:#efefef; stroke:#8a8a8a; stroke-width:1; }
    .title { font-size:16px; font-weight:bold; fill:#111; }
    .sub   { font-size:10.5px; fill:#333; }
    .b     { font-size:11px; fill:#111; }
    .bb    { font-size:11px; font-weight:bold; fill:#111; }
    .lbl   { font-size:10.5px; fill:#1f2937; font-weight:bold; }
    .new   { fill:#c2410c; }
  </style>

  <!-- ═══════════ USER (top right) ═══════════ -->
  <circle cx="1205" cy="34" r="11" fill="#111"/>
  <path d="M1186,62 q19,-16 38,0 z" fill="#111"/>
  <text x="1232" y="34" class="title">User</text>
  <text x="962" y="26" class="lbl">Define goals &amp; select region</text>
  <text x="962" y="39" class="sub">(natural language)</text>
  <path d="M1180,45 L1010,92" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="1042" y="120" class="lbl">Clarifying questions</text>
  <text x="1042" y="132" class="sub">(with MCP evidence)</text>
  <path d="M1015,140 L1192,66" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="1348" y="95" class="lbl">Final report:</text>
  <text x="1348" y="109" class="sub">auto-built deck +</text>
  <text x="1348" y="121" class="sub">figures + verdicts</text>
  <path d="M1390,410 C1445,300 1330,120 1237,58" stroke="#1f2937" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <!-- ═══════════ DATA LAYER (left) ═══════════ -->
  <rect x="22" y="58" width="322" height="300" class="box"/>
  <text x="183" y="82" class="title" text-anchor="middle">Data Layer</text>
  <text x="183" y="97" class="sub" text-anchor="middle">(MCP servers — agent tools · bulk products — model inputs)</text>
  <rect x="38" y="106" width="290" height="122" class="inner"/>
  <text x="50" y="122" class="bb">MCP servers (queried by the agents)</text>
  <text x="50" y="139" class="b">• terrain — USGS 3DEP DEM · WBD watersheds</text>
  <text x="50" y="155" class="b">• geology — USDA SSURGO soil profiles</text>
  <text x="50" y="171" class="b">• usgs_water — wells + stream gauges (OGC API)</text>
  <text x="50" y="187" class="b">• snotel — NRCS SWE · weather — climate</text>
  <text x="50" y="203" class="b">• fan_wtd — Fan 2013 equilibrium water table</text>
  <rect x="38" y="236" width="290" height="108" class="inner"/>
  <text x="50" y="253" class="bb">Bulk products (read at build time) <tspan class="new">NEW</tspan></text>
  <text x="50" y="270" class="b">• NLDAS-2 met forcing, 0.125° / 12 km (default)</text>
  <text x="50" y="286" class="b">• Fan 2013 WTD — warm-start initialization prior</text>
  <text x="50" y="302" class="b">• ParFlow-CONUS2 1-km prior (wishlist, wired)</text>
  <text x="50" y="330" class="sub" font-style="italic">one layer, two access paths: tools for reasoning,</text>
  <text x="50" y="343" class="sub" font-style="italic">bulk reads for building</text>

  <!-- ═══════════ RECEPTION (top center) ═══════════ -->
  <rect x="640" y="70" width="370" height="150" class="box"/>
  <text x="825" y="94" class="title" text-anchor="middle">Reception Agent</text>
  <text x="825" y="109" class="sub" text-anchor="middle">(agentic LLM tool-user — drives the MCP tools itself)</text>
  <rect x="656" y="118" width="338" height="92" class="inner"/>
  <text x="668" y="135" class="bb">Intent + archetype routing</text>
  <text x="668" y="150" class="b">(conceptual / site / coupling experiments)</text>
  <text x="668" y="167" class="b">• gathers evidence: watershed, terrain, soil, obs</text>
  <text x="668" y="182" class="b">• interactive clarification (ask_user tool)</text>
  <text x="668" y="199" class="b">• multi-turn context (follow-up experiments)</text>

  <!-- agentic tool loop between data layer and Reception -->
  <path d="M350,110 C480,85 540,92 636,106" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M636,145 C540,165 470,160 350,142" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="493" y="76" class="lbl" text-anchor="middle">Agentic tool loop</text>
  <text x="493" y="89" class="sub" text-anchor="middle">(LLM calls tools; results feed back — every round)</text>
  <text x="493" y="182" class="sub" text-anchor="middle">regional data retrieval / context exchange</text>

  <!-- reception -> planner / analyzer -->
  <path d="M700,220 C560,290 330,330 240,398" stroke="#1f2937" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="382" y="285" class="lbl">Design new exp. — framed brief JSON</text>
  <text x="382" y="298" class="sub">(domain, drivers, obs available/missing)</text>
  <path d="M960,220 C1080,290 1210,330 1285,398" stroke="#1f2937" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="1085" y="305" class="lbl">Analyze existing exp.</text>
  <text x="1085" y="318" class="sub">+ prior-run context</text>

  <!-- ═══════════ BOTTOM ROW — the original three boxes ═══════════ -->
  <!-- PLANNER -->
  <rect x="22" y="402" width="310" height="330" class="box"/>
  <text x="177" y="426" class="title" text-anchor="middle">Planner Agent</text>
  <text x="177" y="441" class="sub" text-anchor="middle">(heavyweight LLM — capability-aware designer)</text>
  <rect x="38" y="450" width="278" height="268" class="inner"/>
  <text x="50" y="469" class="bb">• Design experiment strategy</text>
  <text x="60" y="484" class="b">N, elevation/soil strata, validation targets</text>
  <text x="60" y="499" class="b">(uses reception's real-world context)</text>
  <text x="50" y="521" class="bb">• Feasibility verdict <tspan class="new">NEW</tspan></text>
  <text x="60" y="536" class="b">answerable vs not-answerable vs needs,</text>
  <text x="60" y="551" class="b">checked against known execution limits</text>
  <text x="50" y="573" class="bb">• requires_capabilities backlog</text>
  <text x="60" y="588" class="b">(the development work a question implies)</text>
  <text x="50" y="610" class="bb">• Strategy altitude only</text>
  <text x="60" y="625" class="b">no coordinates, no per-column configs</text>
  <text x="50" y="651" class="bb">Internal validation loop (iterative)</text>
  <text x="60" y="666" class="b">deterministic brief/plan checks</text>
  <text x="50" y="695" class="sub">models: ELM 1-D ensembles (PFLOTRAN</text>
  <text x="50" y="708" class="sub">coupling designed, not yet built)</text>

  <!-- anti-hallucination boundary at the interface -->
  <line x1="352" y1="396" x2="352" y2="750" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="30" y="768" class="sub" fill="#dc2626" font-weight="bold">◄ LLM side — reasons &amp; designs</text>
  <text x="362" y="768" class="sub" fill="#dc2626" font-weight="bold">deterministic side ► — every coordinate and config comes from data, never from the LLM</text>

  <!-- EXPERIMENT MANAGER (owns materialization + forcing + ICs) -->
  <rect x="372" y="402" width="662" height="330" class="box"/>
  <text x="703" y="426" class="title" text-anchor="middle">Experiment Manager</text>
  <text x="703" y="441" class="sub" text-anchor="middle">(core deterministic pipeline — strategy in, results out · per-column ELM on Perlmutter)</text>

  <rect x="388" y="450" width="308" height="130" class="inner"/>
  <text x="400" y="467" class="bb">1. Materialize sampling <tspan class="new">NEW</tspan></text>
  <text x="400" y="483" class="b">strategy → concrete sites:</text>
  <text x="400" y="499" class="b">• sample real DEM · clip to watershed polygon</text>
  <text x="400" y="515" class="b">• elevation bands · allocate the planner's N</text>
  <text x="400" y="531" class="b">• farthest-point spread · enrich each column</text>
  <text x="412" y="547" class="b">with SSURGO soil + Fan WTD</text>
  <text x="400" y="568" class="bb">→ columns.json + sampling-design figure</text>

  <rect x="388" y="590" width="308" height="128" class="inner"/>
  <text x="400" y="607" class="bb">2. Build &amp; configure</text>
  <text x="400" y="623" class="b">• per-column couplers (lat/lon, soil, years)</text>
  <text x="400" y="639" class="b">• surface + domain NetCDF per column</text>
  <text x="400" y="655" class="b">• forcing: NLDAS-2 streams (default)</text>
  <text x="400" y="671" class="b">• initialization: Fan warm-start finidat <tspan class="new">NEW</tspan></text>
  <text x="400" y="687" class="b">• clone from shared executable (~15 s/column)</text>

  <rect x="710" y="450" width="308" height="86" class="inner"/>
  <text x="722" y="467" class="bb">3. Pre-flight guards <tspan class="new">NEW</tspan></text>
  <text x="722" y="483" class="b">• every column has a distinct, correct soil</text>
  <text x="722" y="499" class="b">• surface/domain coordinate consistency</text>
  <text x="722" y="515" class="b">• forcing streams verified before any node time</text>

  <rect x="710" y="546" width="308" height="86" class="inner"/>
  <text x="722" y="563" class="bb">4. Execute simulations</text>
  <text x="722" y="579" class="b">• one batch job — N columns concurrent, one node</text>
  <text x="722" y="595" class="b">• cost estimate + user confirm before submit</text>
  <text x="722" y="611" class="b">• queue monitoring, per-column status</text>

  <rect x="710" y="642" width="308" height="76" class="inner"/>
  <text x="722" y="659" class="bb">5. Collect results</text>
  <text x="722" y="675" class="b">• per-column history NetCDF + run manifest</text>
  <text x="722" y="691" class="b">• restart states (become future warm-start carriers)</text>

  <!-- user checkpoint tap -->
  <path d="M540,450 C540,410 560,390 610,382" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arrd)"/>
  <text x="620" y="380" class="sub" fill="#6b7280">sampling-design figure — user checkpoint before any compute</text>

  <!-- ANALYZER -->
  <rect x="1054" y="402" width="424" height="330" class="box"/>
  <text x="1266" y="426" class="title" text-anchor="middle">Analyzer</text>
  <text x="1266" y="441" class="sub" text-anchor="middle">(deterministic numbers → observation validation → LLM interpretation)</text>
  <rect x="1070" y="450" width="392" height="82" class="inner"/>
  <text x="1082" y="467" class="bb">a. Deterministic analysis</text>
  <text x="1082" y="483" class="b">water budget P → runoff/infiltration/ET/recharge/Δstorage</text>
  <text x="1082" y="498" class="b">· driver × response matrix (elev, precip, clay, Ksat)</text>
  <text x="1082" y="513" class="b">· honesty flags (forcing bins, fit r², leverage) · figures</text>
  <rect x="1070" y="538" width="392" height="82" class="inner"/>
  <text x="1082" y="555" class="bb">b. Observation validation <tspan class="new">NEW</tspan></text>
  <text x="1082" y="571" class="b">WTD: model vs Fan vs USGS wells · streamflow: specific</text>
  <text x="1082" y="586" class="b">discharge + daily hydrograph NSE/KGE · SNOTEL peak SWE</text>
  <text x="1082" y="601" class="b">· honest status per target: compared vs context-only</text>
  <rect x="1070" y="626" width="392" height="66" class="inner"/>
  <text x="1082" y="643" class="bb">c. LLM interpreter (Answer / Why / Trust / Next)</text>
  <text x="1082" y="659" class="b">verifies against plan + feasibility · cites the numbers</text>
  <text x="1082" y="674" class="b">· recommends next experiments (loop)</text>
  <text x="1082" y="715" class="sub">→ auto-generated storyline deck (question → … → appendix)</text>

  <!-- bottom-row arrows -->
  <path d="M332,565 L368,565" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="338" y="551" class="lbl" font-size="9.5">strategy</text>
  <text x="342" y="585" class="sub" font-size="9">JSON</text>
  <path d="M1034,565 L1050,565" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1036" y="551" class="lbl" font-size="9.5">results</text>
  <text x="1034" y="585" class="sub" font-size="9">package</text>

  <!-- data layer feeds -->
  <path d="M183,358 C220,400 300,470 384,500" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrd)"/>
  <text x="60" y="390" class="sub" fill="#6b7280">DEM · soil · WTD · forcing · priors (bulk reads)</text>
  <path d="M344,340 C760,392 1020,388 1130,398" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrd)"/>
  <text x="770" y="372" class="sub" fill="#6b7280">observations for validation (wells · gauges · SWE)</text>

  <!-- footer -->
  <rect x="22" y="800" width="1456" height="58" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
  <text x="40" y="822" class="bb">Same interfaces as the original design: Reception → Planner → Experiment Manager → Analyzer, JSON at every handoff.</text>
  <text x="40" y="840" class="b">All deviations (orange NEW) are internal to the boxes: sampling materialization + forcing/warm-start live inside the Experiment Manager; feasibility inside the Planner; observation validation inside the Analyzer.</text>
</svg>
