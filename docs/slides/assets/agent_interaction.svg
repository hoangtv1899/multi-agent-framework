<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
  </defs>

  <!-- lifeline headers -->
  <g text-anchor="middle" font-weight="700" font-size="13">
    <rect x="20"  y="30" width="104" height="40" rx="9" fill="#0f172a"/><text x="72"  y="55" fill="#fff">User</text>
    <rect x="170" y="30" width="120" height="40" rx="9" fill="#2c7fb8"/><text x="230" y="55" fill="#fff">Reception</text>
    <rect x="336" y="30" width="120" height="40" rx="9" fill="#fd8d3c"/><text x="396" y="55" fill="#fff">data MCPs</text>
    <rect x="502" y="30" width="112" height="40" rx="9" fill="#2c7fb8"/><text x="558" y="55" fill="#fff">Planner</text>
    <rect x="654" y="30" width="140" height="40" rx="9" fill="#8856a7"/><text x="724" y="55" fill="#fff">Exp. Manager</text>
    <rect x="836" y="30" width="112" height="40" rx="9" fill="#31a354"/><text x="892" y="55" fill="#fff">model MCP</text>
  </g>
  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="72"  y1="70" x2="72"  y2="676"/>
    <line x1="230" y1="70" x2="230" y2="676"/>
    <line x1="396" y1="70" x2="396" y2="676"/>
    <line x1="558" y1="70" x2="558" y2="676"/>
    <line x1="724" y1="70" x2="724" y2="676"/>
    <line x1="892" y1="70" x2="892" y2="676"/>
  </g>

  <g font-size="12" fill="#1e293b">
    <!-- 1 question -->
    <path d="M72,100 L226,100" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="82" y="93" font-weight="600">1 · scientific question</text>

    <!-- reception's LLM loop: reads the model servers -->
    <rect x="206" y="116" width="710" height="76" rx="8" fill="none" stroke="#2c7fb8" stroke-width="1.3" stroke-dasharray="5 4"/>
    <rect x="206" y="116" width="196" height="18" rx="4" fill="#2c7fb8"/><text x="304" y="129" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle">LLM loop — no data, judgement only</text>
    <path d="M234,152 L888,152" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="246" y="146" font-size="11">2 · which models exist? describe each — the brief NAMES the model by reading</text>
    <path d="M888,178 L234,178" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <text x="246" y="172" font-size="11" fill="#475569">what it simulates · whether it can run · what a plan may not vary</text>

    <!-- 3 the code gather -->
    <rect x="206" y="204" width="220" height="72" rx="8" fill="none" stroke="#fd8d3c" stroke-width="1.3" stroke-dasharray="5 4"/>
    <rect x="206" y="204" width="150" height="18" rx="4" fill="#fd8d3c"/><text x="281" y="217" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle">code gather — not the LLM</text>
    <path d="M234,240 L392,240" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="240" y="234" font-size="11">3 · basin · rain · stations</text>
    <path d="M392,264 L234,264" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <text x="240" y="258" font-size="11" fill="#475569">reception.json — the ONLY fetch</text>

    <!-- 4 clarify -->
    <path d="M226,300 L76,300" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="82" y="293" fill="#b45309" font-weight="600">4 · clarify if ambiguous (with the evidence in hand)</text>

    <!-- 5 brief -> planner -->
    <path d="M234,334 L554,334" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="250" y="327" font-weight="700">5 · brief — intent · archetype · the model · domain · period</text>

    <!-- 6 planner asks the chosen model for its limits -->
    <path d="M562,364 L888,364" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="574" y="358" font-size="11">6 · the CHOSEN model's limits + pinning rules</text>

    <!-- 7 design -->
    <path d="M558,392 h50 v30 h-46" fill="none" stroke="#2c7fb8" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="614" y="404" font-size="11.5" fill="#1d5e85">7 · design under those limits:</text>
    <text x="614" y="420" font-size="11.5" fill="#1d5e85">N · strata · what may be compared</text>

    <!-- 8 strategy -> manager -->
    <path d="M562,452 L720,452" stroke="#334155" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="420" y="445" font-weight="700">8 · strategy (altitude only)</text>

    <!-- 9 materialize + the one build call -->
    <rect x="700" y="470" width="216" height="76" rx="8" fill="none" stroke="#8856a7" stroke-width="1.3" stroke-dasharray="5 4"/>
    <rect x="700" y="470" width="180" height="18" rx="4" fill="#8856a7"/><text x="790" y="483" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle">materialize · run · extract</text>
    <path d="M728,506 L888,506" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="580" y="500" font-size="11">9 · the ONE build call, then run</text>
    <path d="M888,532 L728,532" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <text x="560" y="526" font-size="11" fill="#475569">inputs · the run plan · the series — experiment.json</text>

    <!-- 10 coupling loop -->
    <rect x="700" y="556" width="216" height="44" rx="8" fill="none" stroke="#31a354" stroke-width="1.3" stroke-dasharray="5 4"/>
    <rect x="700" y="556" width="140" height="18" rx="4" fill="#31a354"/><text x="770" y="569" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle">coupled runs only</text>
    <text x="712" y="583" font-size="11" fill="#217a3e" font-weight="600">10 · iterate</text>
    <text x="712" y="596" font-size="10.5" fill="#217a3e">one allocation, both legs</text>
    <text x="688" y="578" font-size="11" fill="#217a3e" text-anchor="end">the other model's answer becomes this one's start,</text>
    <text x="688" y="594" font-size="11" fill="#217a3e" text-anchor="end">repeated until the water tables stop moving</text>

    <!-- 11 analyzer -->
    <path d="M720,624 L76,624" stroke="#d97706" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="90" y="617" fill="#92400e" font-weight="700">11 · the Analyzer compares against step 3's observations, then reports — claims, figures, caveats, a verdict</text>
    <text x="90" y="654" font-size="11" fill="#78350f">every number it prints comes from experiment.json; what it cannot ground becomes a caveat, not a sentence</text>
  </g>
</svg>
